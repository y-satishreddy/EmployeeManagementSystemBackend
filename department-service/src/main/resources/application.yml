
  spring:
    application:
      name: department-service

    config:
      import: "optional:configserver:http://localhost:8088"

    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

      consumer:
        group-id: department-service
        auto-offset-reset: earliest
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    datasource:
      url: ${DB_URL:jdbc:mysql://localhost:3306/employee}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:S@tish200}
      driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
      hibernate:
        ddl-auto: update

      show-sql: true

      properties:
        hibernate:
          format_sql: true

  server:
    port: 8081

  eureka:
    client:
      serviceUrl:
        defaultZone: http://localhost:8061/eureka/

    instance:
      instanceId: ${spring.application.name}:${spring.application.instance_id:${random.value}}

  logging:
    pattern:
      console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){blue} %clr([%X{traceId:-},%X{spanId:-}]){cyan} %clr(${LOG_LEVEL_PATTERN:-%5p}) %m%n"

    level:
      org.springframework.kafka: DEBUG
      org.apache.kafka: INFO

  springdoc:
    packagesToScan: pl.piomin.services.department

    cache:
      disabled: true

    version: '@springdoc.version@'

    api-docs:
      version: openapi_3_1

  management:
    tracing:
      sampling:
        probability: 1.0


